name: Validate and package MaiStudio
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: Build unsigned desktop test artifacts after validation
        type: boolean
        default: false
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/tools/ci-fonts.conf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright-core install --with-deps chromium
      - name: Set subtitle font baseline
        run: |
          sudo apt-get install -y fonts-dejavu-core
          fc-match Arial
          node -e "const {execFileSync}=require('node:child_process'); require('node:assert/strict').equal(execFileSync('fc-match',['-f','%{family}','Arial'],{encoding:'utf8'}).trim(),'DejaVu Sans')"
      - run: make build
      - run: make lint
      - run: make test
      - run: node scripts/check-docs.js
  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package_artifacts
    needs: verify
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: --mac dmg zip --arm64
            name: macos-arm64
          - runner: macos-15-intel
            target: --mac dmg zip --x64
            name: macos-x64
          - runner: ubuntu-24.04
            target: --linux AppImage deb --x64
            name: linux-x64
          - runner: ubuntu-24.04-arm
            target: --linux AppImage deb --arm64
            name: linux-arm64
          - runner: windows-latest
            target: --win nsis --x64
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mai-studio-${{ matrix.name }}
          path: release/*
          retention-days: 14
