name: Validate and package MaiStudio
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright-core install --with-deps chromium
      - run: make build
      - run: make lint
      - run: make test
      - run: node scripts/check-docs.js
  package:
    needs: verify
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: --mac dmg zip --arm64
            name: macos-arm64
          - runner: macos-15-intel
            target: --mac dmg zip --x64
            name: macos-x64
          - runner: ubuntu-24.04
            target: --linux AppImage deb --x64
            name: linux-x64
          - runner: ubuntu-24.04-arm
            target: --linux AppImage deb --arm64
            name: linux-arm64
          - runner: windows-latest
            target: --win nsis --x64
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mai-studio-${{ matrix.name }}
          path: release/*
          retention-days: 14
