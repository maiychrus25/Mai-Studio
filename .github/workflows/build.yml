name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: Build unsigned desktop test artifacts after validation
        type: boolean
        default: false
      release_tag:
        description: Optional version tag for a draft release after all checks pass
        type: string
        default: ''
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/tools/ci-fonts.conf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Prepare verification tools without APT
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/media-bin"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz \
            --output "$RUNNER_TEMP/media-bin/ffprobe.gz"
          echo "25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  $RUNNER_TEMP/media-bin/ffprobe.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/media-bin/ffprobe.gz" > "$RUNNER_TEMP/media-bin/ffprobe"
          chmod +x "$RUNNER_TEMP/media-bin/ffprobe"
          echo "$RUNNER_TEMP/media-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/media-bin/ffprobe" -version
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Set subtitle font baseline
        run: |
          fc-match Arial
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {readFileSync} = require('node:fs');
          const {createHash} = require('node:crypto');
          const font = execFileSync('fc-match', ['-f', '%{file}', 'Arial'], {encoding: 'utf8'}).trim();
          require('node:assert/strict').equal(execFileSync('fc-match', ['-f', '%{family}', 'Arial'], {encoding: 'utf8'}).trim(), 'DejaVu Sans');
          const ffmpeg = require('ffmpeg-static');
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          console.log(JSON.stringify({font, fontSha256: sha256(font), ffmpeg, ffmpegSha256: sha256(ffmpeg), version: execFileSync(ffmpeg, ['-version'], {encoding: 'utf8'}).split('\n')[0]}));
          const fs = require('node:fs');
          const directory = fs.mkdtempSync(require('node:path').join(require('node:os').tmpdir(), 'mai-ci-subtitle-'));
          const subtitle = require('node:path').join(directory, 'caption.srt');
          try {
            fs.writeFileSync(subtitle, '1\n00:00:00,000 --> 00:00:01,000\nLAST\n');
            execFileSync(ffmpeg, ['-hide_banner', '-f', 'lavfi', '-i', 'color=c=red:s=160x120:r=20:d=1', '-vf', 'subtitles=filename=' + subtitle, '-frames:v', '1', '-f', 'null', '-'], {stdio: 'inherit'});
          } finally { fs.rmSync(directory, {recursive: true, force: true}); }
          NODE
      - run: make build
      - run: make lint
      - name: Check hierarchical subtitle rendering
        run: node --test --test-name-pattern='hierarchical slideshow renders' dist/tests/media.test.js
      - run: make test
      - run: node scripts/check-docs.js
  package:
    name: Đóng gói ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.package_artifacts
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: --mac dmg zip --arm64
            name: macos-arm64
          - runner: macos-15-intel
            target: --mac dmg zip --x64
            name: macos-x64
          - runner: ubuntu-24.04
            target: --linux AppImage deb --x64
            name: linux-x64
          - runner: ubuntu-24.04-arm
            target: --linux AppImage deb --arm64
            name: linux-arm64
          - runner: windows-latest
            target: --win nsis --x64
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Đóng gói bản cài
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then extra+=("-c.mac.identity=-"); fi
          npx electron-builder ${{ matrix.target }} --publish never "${extra[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mai-studio-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
  release:
    name: Prepare draft release
    needs: [verify, package]
    if: github.event_name == 'workflow_dispatch' && inputs.package_artifacts && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mai-studio-*
          path: installers
      - name: Verify installers and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, shutil, subprocess
          version = json.loads(Path('package.json').read_text())['version']
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'\d+\.\d+\.\d+-dev\.\d+', version) and tag == 'v' + version, 'Release tag must match the development package version'
          expected = {
              'macos-arm64': {f'MaiStudio-{version}-arm64.dmg', f'MaiStudio-{version}-arm64-mac.zip'},
              'macos-x64': {f'MaiStudio-{version}.dmg', f'MaiStudio-{version}-mac.zip'},
              'linux-arm64': {f'MaiStudio-{version}-arm64.AppImage', f'mai-studio_{version}_arm64.deb'},
              'linux-x64': {f'MaiStudio-{version}.AppImage', f'mai-studio_{version}_amd64.deb'},
              'windows-x64': {f'MaiStudio Setup {version}.exe'},
          }
          staging = Path(os.environ['RUNNER_TEMP']) / 'release-files'
          staging.mkdir()
          files = []
          for platform, names in expected.items():
              directory = Path('installers') / ('mai-studio-' + platform)
              actual = {p.name for p in directory.iterdir() if p.suffix in {'.dmg', '.zip', '.deb', '.AppImage', '.exe'}}
              assert actual == names, f'Unexpected installer set for {platform}: {actual}'
              for name in sorted(names):
                  source = directory / name
                  assert source.is_file() and not source.is_symlink() and source.stat().st_size > 0
                  target = staging / name.replace(' ', '.')
                  assert not target.exists(), 'Duplicate release asset name'
                  shutil.copyfile(source, target)
                  files.append(target)
          assert len(files) == 9
          lines = []
          for path in sorted(files):
              with path.open('rb') as stream:
                  lines.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.name)
          checksum_text = '\n'.join(lines) + '\n'
          manifest = staging / 'SHA256SUMS.txt'
          manifest.write_text(checksum_text)
          run_url = f"https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          notes = staging / 'release-notes.md'
          notes.write_text(f'''MaiStudio {version} — bản phát triển thử nghiệm cho macOS ARM64/Intel, Linux ARM64/x64 và Windows x64.

          - Sửa lỗi Invalid Shopee product numeric fact: dùng giá đơn khi khoảng giá được đánh dấu -1.
          - Nhập đủ tối đa 9 ảnh gallery, giữ kiểm tra ảnh và checkpoint hủy/thử lại.
          - Sửa bookmarklet ưu tiên gallery sản phẩm trước một ảnh SEO; sau cập nhật cần chép lại mã và thay URL dấu trang cũ.
          - Nguồn build: {os.environ['GITHUB_SHA']}.
          - CI: {run_url}. Bản nháp chỉ được tạo sau verify và năm job đóng gói thành công.
          - Linux ARM64/Kubuntu: tải file _arm64.deb; ARM64 AppImage cũng có trong Assets.

          macOS ký ad-hoc, chưa notarized; Windows chưa ký chứng chỉ tin cậy. Chưa chứng nhận runtime mọi OS/provider hoặc đầy đủ Muse parity. Không bật auto-update hoặc deploy service.

          SHA256 của các bộ cài:
          ```text
          {checksum_text}```
          ''')
          subprocess.run(['gh', 'release', 'create', tag, '--repo', os.environ['GH_REPO'], '--target', os.environ['GITHUB_SHA'], '--draft', '--prerelease', '--title', f'MaiStudio {version} — Shopee fixes and 9 images', '--notes-file', str(notes), *map(str, files), str(manifest)], check=True)
          print(f'Draft {tag}: nine installers and checksum manifest uploaded; publication requires final verification.')
          PY
